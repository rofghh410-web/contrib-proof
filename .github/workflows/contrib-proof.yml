name: Contributor proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        id: contrib-proof
        with:
          execute: ${{ github.event_name == 'push' && 'true' || 'false' }}
          diff: "true"
          gate: "true"
          require-review: "true"
          format: markdown

  release-readiness:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          release: "true"
          since: HEAD~1
          format: markdown
