name: "ContribProof"
description: "Run evidence-first contributor-path checks with least privilege."
author: "ContribProof contributors"
inputs:
  execute:
    description: "Execute commands declared in .contrib-proof.json."
    required: false
    default: "false"
  diff:
    description: "Analyze changed files against the pull request base."
    required: false
    default: "false"
  gate:
    description: "Apply the configured deterministic merge-gate policy and use its exit code."
    required: false
    default: "false"
  release:
    description: "Run release-readiness checks against Git history and repository metadata."
    required: false
    default: "false"
  fixtures:
    description: "Run the declarative fixture contract suite instead of the repository report."
    required: false
    default: "false"
  fixtures-path:
    description: "Repository-relative fixture manifest path."
    required: false
    default: .contrib-proof-fixtures.json
  fixture-cases:
    description: "Optional comma-separated fixture case IDs; empty runs the complete suite."
    required: false
    default: ""
  base:
    description: "Optional Git base ref for the change policy."
    required: false
    default: ""
  since:
    description: "Optional Git ref for release-readiness comparison. Falls back to base when unset."
    required: false
    default: ""
  format:
    description: "Report format: markdown, json, sarif, or html."
    required: false
    default: markdown
  strict:
    description: "Treat warnings as failures."
    required: false
    default: "false"
  max-risk:
    description: "Optional gate risk threshold: routine, elevated, or high."
    required: false
    default: ""
  require-review:
    description: "Require a usable Git diff when gate mode is enabled."
    required: false
    default: "false"
  fail-on-warnings:
    description: "Make warning checks block gate mode."
    required: false
    default: "false"
  annotations:
    description: "Emit opt-in GitHub workflow annotations for failures and warnings."
    required: false
    default: "false"
  bundle:
    description: "Optional output directory for a complete proof bundle."
    required: false
    default: ""
  exceptions-path:
    description: "Repository-relative JSON policy exception file."
    required: false
    default: .contrib-proof-exceptions.json
  apply-exceptions:
    description: "Apply valid, unexpired exceptions while retaining the original finding status."
    required: false
    default: "false"
  ledger-path:
    description: "Repository-relative append-only maintenance ledger path."
    required: false
    default: .contrib-proof-ledger.jsonl
  record-ledger:
    description: "Record the generated JSON report in the tamper-evident maintenance ledger."
    required: false
    default: "false"
  attest:
    description: "Sign the generated proof bundle with an Ed25519 private key. Requires bundle and private-key-path."
    required: false
    default: "false"
  private-key-path:
    description: "Path to an existing Ed25519 private key on the runner; never pass the key contents as an argument."
    required: false
    default: ""
  attestation-key-id:
    description: "Optional stable maintainer key identifier embedded in the attestation."
    required: false
    default: ""
outputs:
  report_path:
    description: "Path to the generated report on the runner."
    value: ${{ steps.run.outputs.report_path }}
  attestation_path:
    description: "Path to the optional Ed25519 attestation in the proof bundle."
    value: ${{ steps.run.outputs.attestation_path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - id: run
      shell: bash
      env:
        CP_EXECUTE: ${{ inputs.execute }}
        CP_DIFF: ${{ inputs.diff }}
        CP_GATE: ${{ inputs.gate }}
        CP_RELEASE: ${{ inputs.release }}
        CP_FIXTURES: ${{ inputs.fixtures }}
        CP_FIXTURES_PATH: ${{ inputs['fixtures-path'] }}
        CP_FIXTURE_CASES: ${{ inputs['fixture-cases'] }}
        CP_BASE: ${{ inputs.base }}
        CP_SINCE: ${{ inputs.since }}
        CP_FORMAT: ${{ inputs.format }}
        CP_STRICT: ${{ inputs.strict }}
        CP_MAX_RISK: ${{ inputs['max-risk'] }}
        CP_REQUIRE_REVIEW: ${{ inputs['require-review'] }}
        CP_FAIL_ON_WARNINGS: ${{ inputs['fail-on-warnings'] }}
        CP_ANNOTATIONS: ${{ inputs.annotations }}
        CP_BUNDLE: ${{ inputs.bundle }}
        CP_EXCEPTIONS_PATH: ${{ inputs['exceptions-path'] }}
        CP_APPLY_EXCEPTIONS: ${{ inputs['apply-exceptions'] }}
        CP_LEDGER_PATH: ${{ inputs['ledger-path'] }}
        CP_RECORD_LEDGER: ${{ inputs['record-ledger'] }}
        CP_ATTEST: ${{ inputs.attest }}
        CP_PRIVATE_KEY: ${{ inputs['private-key-path'] }}
        CP_ATTESTATION_KEY_ID: ${{ inputs['attestation-key-id'] }}
      run: |
        set -uo pipefail
        report_path="${RUNNER_TEMP}/contrib-proof-report.${CP_FORMAT}"
        if [[ "$CP_ATTEST" == "true" && "$CP_FIXTURES" == "true" ]]; then
          echo "::error::attest cannot be combined with fixtures mode."
          exit 2
        elif [[ "$CP_ATTEST" == "true" && -z "$CP_BUNDLE" ]]; then
          echo "::error::attest requires the bundle input so the signed manifest has a stable location."
          exit 2
        elif [[ "$CP_ATTEST" == "true" && -z "$CP_PRIVATE_KEY" ]]; then
          echo "::error::attest requires private-key-path pointing to an existing Ed25519 private key."
          exit 2
        elif [[ "$CP_FIXTURES" == "true" && ( "$CP_GATE" == "true" || "$CP_RELEASE" == "true" || "$CP_RECORD_LEDGER" == "true" ) ]]; then
          echo "::error::fixtures mode cannot be combined with release, gate, or record-ledger."
          exit 2
        elif [[ "$CP_FIXTURES" == "true" ]]; then
          args=(fixtures --root "$GITHUB_WORKSPACE" --format "$CP_FORMAT" --output "$report_path" --fixtures-path "$CP_FIXTURES_PATH")
          if [[ -n "$CP_FIXTURE_CASES" ]]; then IFS=',' read -r -a fixture_case_ids <<< "$CP_FIXTURE_CASES"; for case_id in "${fixture_case_ids[@]}"; do if [[ -n "$case_id" ]]; then args+=(--case "$case_id"); fi; done; fi
        elif [[ "$CP_RELEASE" == "true" ]]; then
          args=(release --root "$GITHUB_WORKSPACE" --format "$CP_FORMAT" --output "$report_path")
        elif [[ "$CP_GATE" == "true" ]]; then
          args=(gate --root "$GITHUB_WORKSPACE" --format "$CP_FORMAT" --output "$report_path")
        else
          args=(verify --root "$GITHUB_WORKSPACE" --format "$CP_FORMAT" --output "$report_path")
        fi
        if [[ "$CP_EXECUTE" == "true" ]]; then args+=(--execute); fi
        if [[ "$CP_FIXTURES" != "true" ]]; then
          if [[ "$CP_DIFF" == "true" ]]; then args+=(--diff); fi
          if [[ -n "$CP_BASE" ]]; then args+=(--base "$CP_BASE"); fi
          if [[ -n "$CP_SINCE" ]]; then args+=(--since "$CP_SINCE"); fi
          if [[ "$CP_STRICT" == "true" ]]; then args+=(--strict); fi
          if [[ -n "$CP_MAX_RISK" ]]; then args+=(--max-risk "$CP_MAX_RISK"); fi
          if [[ "$CP_REQUIRE_REVIEW" == "true" ]]; then args+=(--require-review); fi
          if [[ "$CP_FAIL_ON_WARNINGS" == "true" ]]; then args+=(--fail-on-warnings); fi
          if [[ "$CP_ANNOTATIONS" == "true" ]]; then args+=(--github-annotations); fi
          if [[ -n "$CP_BUNDLE" ]]; then args+=(--bundle "$CP_BUNDLE"); fi
        fi
        if [[ -n "$CP_EXCEPTIONS_PATH" ]]; then args+=(--exceptions-path "$CP_EXCEPTIONS_PATH"); fi
        if [[ "$CP_APPLY_EXCEPTIONS" == "true" ]]; then args+=(--apply-exceptions); fi
        set +e
        node "$GITHUB_ACTION_PATH/bin/contrib-proof.js" "${args[@]}"
        status=$?
        if [[ "$CP_ATTEST" == "true" ]]; then
          attest_args=(attest "$CP_BUNDLE" --private-key "$CP_PRIVATE_KEY")
          if [[ -n "$CP_ATTESTATION_KEY_ID" ]]; then attest_args+=(--key-id "$CP_ATTESTATION_KEY_ID"); fi
          node "$GITHUB_ACTION_PATH/bin/contrib-proof.js" "${attest_args[@]}"
          attest_status=$?
          if [[ "$status" == "0" && "$attest_status" != "0" ]]; then status="$attest_status"; fi
        fi
        if [[ "$CP_RECORD_LEDGER" == "true" ]]; then
          if [[ "$CP_FORMAT" != "json" ]]; then
            echo "::error::record-ledger requires format=json so the report can be validated safely."
            ledger_status=2
          else
            ledger_report="${RUNNER_TEMP}/contrib-proof-ledger.json"
            node "$GITHUB_ACTION_PATH/bin/contrib-proof.js" ledger --root "$GITHUB_WORKSPACE" --record "$report_path" --ledger-path "$CP_LEDGER_PATH" --format json --output "$ledger_report"
            ledger_status=$?
          fi
          if [[ "$status" == "0" && "$ledger_status" != "0" ]]; then status="$ledger_status"; fi
        fi
        set -e
        if [[ "$CP_FORMAT" == "markdown" && -f "$report_path" ]]; then
          cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
        if [[ "$CP_ATTEST" == "true" ]]; then echo "attestation_path=${CP_BUNDLE}/attestation.json" >> "$GITHUB_OUTPUT"; else echo "attestation_path=" >> "$GITHUB_OUTPUT"; fi
        exit "$status"
