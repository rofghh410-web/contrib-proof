name: contributor proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rofghh410-web/contrib-proof@v0.8.1
        with:
          execute: ${{ github.event_name == 'push' && 'true' || 'false' }}
          diff: "true"
          gate: "true"
          require-review: "true"
          annotations: "true"
          record-ledger: "false"
